name: Affiliate OS CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and PR events for the same working branch share a group; keep only one run active.
  group: affiliate-os-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repo-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify repository inventory and source syntax
        run: python scripts/verify_project.py
      - name: Verify pinned 53-skill source and runtime parity
        run: python scripts/verify_skill_registry.py

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Verify source bundle
        run: python scripts/verify_project.py
      - name: Migration graph and empty SQLite upgrade
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./storage/ci-test.db
        run: mkdir -p storage && rm -f storage/ci-test.db && alembic heads && alembic upgrade head && alembic current && alembic check && alembic downgrade -1 && alembic upgrade head && alembic check
      - name: Compile Python
        run: python -m compileall -q backend ai_memory tests scripts migrations
      - name: Run tests
        env:
          APP_ENV: development
          LLM_BACKEND: offline
          DATABASE_URL: sqlite+aiosqlite:///./storage/ci-test.db
        run: pytest -q


  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omni_affiliate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omni_affiliate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: PostgreSQL migration upgrade/downgrade and drift gate
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/omni_affiliate_test
        run: alembic heads && alembic upgrade head && alembic current && alembic check && alembic downgrade -1 && alembic upgrade head && alembic check
      - name: Verify concurrent conversion reversals against PostgreSQL
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/omni_affiliate_test
          POSTGRES_WEBHOOK_INTEGRATION: "1"
        run: pytest -q tests/test_conversion_webhook_postgres.py

  ai-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - name: Install CPU-only PyTorch and optional AI/RAG dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements-ai.txt
      - name: Verify AI/RAG dependency imports
        run: python scripts/verify_ai_profile.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Preserve the committed lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Typecheck
        run: npm run typecheck
      - name: Build production UI
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build


  lockfile-sync:
    # Capture the runner-resolved lockfile once, then validate a clean npm ci install
    # before committing the exact artifact to the one existing implementation branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/omni-affiliate-os-production'
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download the resolved frontend lockfile
        uses: actions/download-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend
      - name: Validate lockfile matches package manifest
        working-directory: frontend
        run: |
          node - <<'NODE'
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          if (lock.lockfileVersion !== 3) throw new Error("Expected npm lockfile v3");
          for (const section of ["dependencies", "devDependencies"]) {
            if (JSON.stringify(pkg[section] || {}) !== JSON.stringify((lock.packages[""] || {})[section] || {})) {
              throw new Error(`package-lock root ${section} do not match package.json`);
            }
          }
          console.log(`Validated npm lockfile v${lock.lockfileVersion} with ${Object.keys(lock.packages).length - 1} dependency packages`);
          NODE
      - name: Verify reproducible clean install and production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm ci --no-audit --no-fund && npm run typecheck && npm run build
      - name: Commit resolved lockfile without rewriting history
        id: commit-lockfile
        run: |
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Frontend lockfile is already committed and unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: pin frontend npm lockfile"
            git push origin HEAD:build/omni-affiliate-os-production
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "lockfile_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi


  dependency-remediation:
    # One-shot dependency lock refresh. It only runs for the explicitly named remediation commit
    # on the existing implementation branch, then self-disables for subsequent commits.
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/omni-affiliate-os-production' && contains(github.event.head_commit.message, 'remediate frontend dependency advisories')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve patched frontend dependency graph
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Require a clean frontend dependency audit
        working-directory: frontend
        run: npm audit
      - name: Revalidate clean install, types, and production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm ci --no-audit --no-fund && npm run typecheck && npm run build
      - name: Commit refreshed lockfile on the existing branch
        run: |
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Expected the patched dependency graph to change the lockfile, but no changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh patched frontend dependency lockfile"
          git push origin HEAD:build/omni-affiliate-os-production

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependency audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit core runtime and test dependency graph
        run: pip-audit -r requirements-dev.txt
      - name: Verify local-only ChromaDB security boundary
        run: python scripts/verify_chroma_security_boundary.py
      - name: Report temporary ChromaDB upstream advisory exception
        run: echo "::warning::ChromaDB 1.5.9 is affected by upstream advisories with no fixed PyPI release yet. This workflow accepts only the four documented PYSEC IDs for the embedded local-only configuration; this is not a clean scan or production-release approval. See docs/SECURITY_EXCEPTIONS.md."
      - name: Audit optional AI and RAG dependency graph (only documented unpatched Chroma IDs excepted)
        run: >-
          pip-audit -r requirements-ai.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3813
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies from the committed lockfile
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Audit frontend dependency graph
        working-directory: frontend
        run: npm audit --audit-level=high
