services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: affiliate_os
      POSTGRES_USER: affiliate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate -d affiliate_os"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Omnichannel Affiliate OS}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?Set a random APP_SESSION_SECRET}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DATABASE_URL: postgresql+asyncpg://affiliate:${POSTGRES_PASSWORD}@postgres:5432/affiliate_os
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Uvicorn forwarded-header trust; never use * on public deployments.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      EXECUTION_MODE: ${EXECUTION_MODE:-SEMI_AUTONOMOUS}
      LLM_BACKEND: ${LLM_BACKEND:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LOCAL_MODEL_PATH: ${LOCAL_MODEL_PATH:-}
      LOCAL_LORA_ADAPTER_PATH: ${LOCAL_LORA_ADAPTER_PATH:-}
      AFFILIATE_SKILLS_DIR: /app/knowledge/affiliate-skills
      # Legacy mapping retained; the directory now stores the local SQLite vector index.
      CHROMA_PERSIST_DIR: /app/storage/chroma
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      OPENAFFILIATE_BASE_URL: ${OPENAFFILIATE_BASE_URL:-https://openaffiliate.dev/api}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_ACCESS_TOKEN: ${REDDIT_ACCESS_TOKEN:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-AffiliateOS/0.1}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      PINTEREST_ACCESS_TOKEN: ${PINTEREST_ACCESS_TOKEN:-}
      PUBLISHING_DRY_RUN: ${PUBLISHING_DRY_RUN:-true}
      VIDEO_OUTPUT_DIR: /app/storage/videos
      RESOURCE_BUDGET_USD_PER_DAY: ${RESOURCE_BUDGET_USD_PER_DAY:-5.00}
      RESOURCE_BUDGET_USD_PER_NICHE: ${RESOURCE_BUDGET_USD_PER_NICHE:-1.50}
      TRACKING_HMAC_SECRET: ${TRACKING_HMAC_SECRET:?Set independent TRACKING_HMAC_SECRET}
      AFFILIATE_WEBHOOK_SECRET: ${AFFILIATE_WEBHOOK_SECRET:?Set independent AFFILIATE_WEBHOOK_SECRET}
      AD_AUTOMATION_EXECUTE: ${AD_AUTOMATION_EXECUTE:-false}
      CMS_PUBLISH_EXECUTE: ${CMS_PUBLISH_EXECUTE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-imap.gmail.com}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_IMAP_USER: ${MAIL_IMAP_USER:-}
      MAIL_IMAP_PASSWORD: ${MAIL_IMAP_PASSWORD:-}
      MAIL_SENDER_ALLOWLIST: ${MAIL_SENDER_ALLOWLIST:-}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:-}
      WORDPRESS_USERNAME: ${WORDPRESS_USERNAME:-}
      WORDPRESS_APPLICATION_PASSWORD: ${WORDPRESS_APPLICATION_PASSWORD:-}
      GHOST_SITE_URL: ${GHOST_SITE_URL:-}
      GHOST_ADMIN_API_KEY: ${GHOST_ADMIN_API_KEY:-}
    volumes:
      - app_storage:/app/storage
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 45s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NODE_ENV: production
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-3000}:3000"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  app_storage:
