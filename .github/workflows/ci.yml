name: Affiliate OS CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affiliate-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Verify source bundle
        run: python scripts/verify_project.py
      - name: Migration graph and empty SQLite upgrade
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./storage/ci-test.db
        run: mkdir -p storage && rm -f storage/ci-test.db && alembic heads && alembic upgrade head && alembic current && alembic check
      - name: Compile Python
        run: python -m compileall -q backend ai_memory tests scripts migrations
      - name: Run tests
        env:
          APP_ENV: development
          LLM_BACKEND: offline
          DATABASE_URL: sqlite+aiosqlite:///./storage/ci-test.db
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build production UI
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
